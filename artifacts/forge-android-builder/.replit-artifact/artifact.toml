kind = "mobile"
previewPath = "/forge/"
title = "Forge Android Builder"
description = "An Android-first local app builder that interviews users about an app idea, produces a structured build brief, and keeps the project workflow on-device with a lightweight API companion."
version = "1.0.0"
id = "artifacts/forge-android-builder"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/forge/" ]
localPort = 24917

[services.development]
run = "pnpm --filter @workspace/forge-android-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forge-android-builder", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/forge-android-builder", "run", "serve" ]

[services.env]
PORT = "24917"
BASE_PATH = "/forge/"
